<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>css 연습하기</title>
</head>
<body>
    <h1 class="red">어서오세요!</h1>
    <h1 class="blue">반갑습니다!</h1>
    <p class="green">첫 번째 문단</p>
    <p class="pink">두 번째 문단</p>
    <h1 class="blue">안녕하세요.</h1>
    <p class="pink">세 번째 문단</p>
    <hr>
    <h1 id="gray">저는 java를 좋아합니다.</h1>
    <!-- id 값은 해당 페이지 내에서 중복되면 안된다! -->
    <strong class="red">프로그래밍 화이팅!!</strong>
</body>
</html>
